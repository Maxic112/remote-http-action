[package]
name = "remote-http-action"
version = "0.1.0"
description = "HTTP server for running predefined actions on a Windows computer"
authors = ["remote-http-action contributors"]
license = "MIT"
edition = "2024"
default-run = "remote-http-action"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "remote_http_action_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
axum = "0.8.9"
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
sha2 = "0.11.1"
rand = "0.10.3"
hex = "0.4.3"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
ipnet = "2.12.2"
clap = { version = "4.6.7", features = ["derive"] }
async-trait = "0.1.92"
if-addrs = "0.15.0"
sys-locale = "0.3.2"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.14"
tauri-plugin-dialog = "2"
time = "0.3.55"
pem = "4.0.0"
x509-parser = "0.18.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }
