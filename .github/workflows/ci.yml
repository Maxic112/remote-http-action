name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Check version
        shell: pwsh
        run: ./scripts/check-version.ps1

      # tauri::generate_context! expects the frontend build output to exist.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test:all

      - name: Smoke test
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bins
          ./scripts/smoke.ps1
